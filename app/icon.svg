<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Black circle background -->
  <circle cx="16" cy="16" r="16" fill="#000000"/>
  <!-- Green-bordered tile -->
  <rect x="4" y="8" width="24" height="16" rx="2.5" fill="rgba(255,255,255,0.05)" stroke="#16a34a" stroke-width="1.5"/>
  <!-- Divider -->
  <line x1="16" y1="9.5" x2="16" y2="22.5" stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
  <!-- S -->
  <text x="10.5" y="21" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff">S</text>
  <!-- G -->
  <text x="21.5" y="21" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" fill="#4ade80">G</text>
</svg>
