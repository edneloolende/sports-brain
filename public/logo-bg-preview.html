<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Background Options</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c1018;
    color: white;
    font-family: Inter, system-ui, sans-serif;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 20px;
  }
  .row { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .size-label { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.05em; }
  .circle-crop { border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .divider { height: 1px; background: rgba(255,255,255,0.07); }
  .bg-label { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 500; }
</style>
</head>
<body>

<!-- Row: all three at large size -->
<div>
  <div class="section-label">200px — profile picture size</div>
  <div class="row">

    <!-- Black -->
    <div class="col">
      <div class="circle-crop" style="width:200px;height:200px;">
        <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="100" fill="#000000"/>
          <rect x="28" y="60" width="144" height="82" rx="7" fill="rgba(255,255,255,0.05)" stroke="#16a34a" stroke-width="2"/>
          <text x="72" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="56" fill="white">S</text>
          <text x="130" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="56" fill="#4ade80">G</text>
          <line x1="100" y1="68" x2="100" y2="134" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        </svg>
      </div>
      <div class="bg-label">Plain black</div>
      <div class="size-label">#000000</div>
    </div>

    <!-- Current dark green -->
    <div class="col">
      <div class="circle-crop" style="width:200px;height:200px;">
        <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="100" fill="#0f1f0f"/>
          <rect x="28" y="60" width="144" height="82" rx="7" fill="rgba(255,255,255,0.05)" stroke="#16a34a" stroke-width="2"/>
          <text x="72" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="56" fill="white">S</text>
          <text x="130" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="56" fill="#4ade80">G</text>
          <line x1="100" y1="68" x2="100" y2="134" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        </svg>
      </div>
      <div class="bg-label">Current dark green</div>
      <div class="size-label">#0f1f0f</div>
    </div>

    <!-- Lighter green -->
    <div class="col">
      <div class="circle-crop" style="width:200px;height:200px;">
        <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="100" fill="#0d2d1a"/>
          <rect x="28" y="60" width="144" height="82" rx="7" fill="rgba(255,255,255,0.06)" stroke="#22c55e" stroke-width="2"/>
          <text x="72" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="56" fill="white">S</text>
          <text x="130" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="56" fill="#4ade80">G</text>
          <line x1="100" y1="68" x2="100" y2="134" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        </svg>
      </div>
      <div class="bg-label">Lighter green</div>
      <div class="size-label">#0d2d1a</div>
    </div>

  </div>
</div>

<div class="divider"></div>

    </div>
  </div>
</div>
